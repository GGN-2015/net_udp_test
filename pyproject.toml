[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udp-rate-probe"
version = "1.0.0"
description = "Desktop and Android UDP sustainable-rate probe with a TCP control channel"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
udp-rate-probe = "udp_probe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
